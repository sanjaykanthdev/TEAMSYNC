version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: teamsync-postgres
    restart: always
    environment:
      POSTGRES_USER: teamsync
      POSTGRES_PASSWORD: teamsync_password
      POSTGRES_DB: teamsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: teamsync-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamsync-backend
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://teamsync:teamsync_password@db:5432/teamsync
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=teamsync_super_production_secret_key_change_me
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamsync-celery-worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://teamsync:teamsync_password@db:5432/teamsync
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamsync-celery-beat
    restart: always
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://teamsync:teamsync_password@db:5432/teamsync
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamsync-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
